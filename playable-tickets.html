<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Playable Tickets</title>
<style>
  :root{
    --bg:#0f1115; --panel:#161a21; --card:#1b1f28; --line:#272d39; --txt:#e8eaed;
    --muted:#9aa3b2; --accent:#58a6ff; --ok:#3fb950; --warn:#d29922; --bad:#f85149; --chip:#232936;
  }
  *{box-sizing:border-box}
  html,body{height:100%}
  body{margin:0;background:var(--bg);color:var(--txt);font:14px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;display:flex;flex-direction:column;height:100vh}
  header{display:flex;align-items:center;gap:12px;padding:12px 18px;border-bottom:1px solid var(--line);background:var(--panel);flex-wrap:wrap}
  header h1{font-size:16px;margin:0;font-weight:700;white-space:nowrap}
  header .grow{flex:1}
  input,select,textarea,button{font:inherit;color:var(--txt)}
  .btn{background:var(--chip);border:1px solid var(--line);border-radius:8px;padding:7px 12px;cursor:pointer}
  .btn:hover{border-color:var(--accent)}
  .btn.primary{background:var(--accent);color:#06121f;border-color:var(--accent);font-weight:600}
  .btn.ghost{background:transparent}
  .btn.sm{padding:4px 9px;font-size:12px}
  .search{background:var(--card);border:1px solid var(--line);border-radius:8px;padding:7px 11px;min-width:200px}
  .status-dot{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:6px;vertical-align:middle}
  .d-open{background:var(--accent)} .d-progress{background:var(--warn)} .d-closed{background:var(--muted)}
  main{flex:1;display:flex;min-height:0}
  aside{width:250px;border-right:1px solid var(--line);background:var(--panel);overflow-y:auto;padding:10px}
  aside .sec{color:var(--muted);font-size:11px;text-transform:uppercase;letter-spacing:.05em;margin:14px 8px 6px}
  .navitem{display:flex;justify-content:space-between;align-items:center;padding:7px 10px;border-radius:8px;cursor:pointer;gap:8px}
  .navitem:hover{background:var(--card)}
  .navitem.active{background:var(--card);box-shadow:inset 2px 0 0 var(--accent)}
  .navitem .cnt{background:var(--chip);border-radius:999px;padding:1px 8px;font-size:12px;color:var(--muted);min-width:22px;text-align:center}
  .navitem-name{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  section.list{flex:1;overflow-y:auto;padding:16px 18px}
  .toolbar{display:flex;gap:8px;align-items:center;margin-bottom:14px;flex-wrap:wrap}
  .seg{display:flex;border:1px solid var(--line);border-radius:8px;overflow:hidden}
  .seg button{background:transparent;border:0;padding:6px 12px;cursor:pointer;color:var(--muted)}
  .seg button.active{background:var(--chip);color:var(--txt)}
  .ticket{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:12px 14px;margin-bottom:10px;cursor:pointer}
  .ticket:hover{border-color:#3a4456}
  .ticket .top{display:flex;align-items:center;gap:8px}
  .ticket .tid{color:var(--muted);font-size:12px;font-variant-numeric:tabular-nums}
  .ticket .title{font-weight:600;flex:1}
  .ticket.closed .title{color:var(--muted);text-decoration:line-through}
  .ticket .meta{display:flex;gap:10px;color:var(--muted);font-size:12px;margin-top:6px;flex-wrap:wrap}
  .pill{display:inline-block;padding:1px 8px;border-radius:999px;font-size:11px;font-weight:600}
  .pr-high{background:rgba(248,81,73,.16);color:var(--bad)} .pr-med{background:rgba(210,153,34,.16);color:var(--warn)} .pr-low{background:rgba(154,163,178,.16);color:var(--muted)}
  .tag{background:var(--chip);border-radius:6px;padding:1px 7px}
  .empty{color:var(--muted);text-align:center;padding:50px 0}
  /* modal */
  .ov{position:fixed;inset:0;background:rgba(0,0,0,.55);display:none;align-items:flex-start;justify-content:center;padding:40px 16px;overflow-y:auto;z-index:20}
  .ov.show{display:flex}
  .modal{background:var(--panel);border:1px solid var(--line);border-radius:14px;width:100%;max-width:640px;padding:20px}
  .modal h2{margin:0 0 14px;font-size:18px}
  .field{margin-bottom:12px}
  .field label{display:block;color:var(--muted);font-size:12px;margin-bottom:4px}
  .field input,.field select,.field textarea{width:100%;background:var(--card);border:1px solid var(--line);border-radius:8px;padding:9px 11px}
  .field textarea{min-height:80px;resize:vertical}
  .row{display:flex;gap:12px}.row>*{flex:1}
  .modal .actions{display:flex;gap:8px;justify-content:flex-end;margin-top:8px;flex-wrap:wrap}
  .modal .actions .grow{flex:1}
  .comments{margin-top:10px;border-top:1px solid var(--line);padding-top:12px}
  .comment{background:var(--card);border:1px solid var(--line);border-radius:8px;padding:9px 11px;margin-bottom:8px}
  .comment .c-meta{color:var(--muted);font-size:11px;margin-bottom:3px}
  .comment .c-text{white-space:pre-wrap}
  .addc{display:flex;gap:8px;margin-top:8px}
  .addc textarea{flex:1;min-height:38px}
  .desc-block{white-space:pre-wrap;background:var(--card);border:1px solid var(--line);border-radius:8px;padding:10px 12px;color:var(--txt)}
  .hint{color:var(--muted);font-size:12px}
  .save-state{font-size:12px;color:var(--muted)}
  .save-state b{color:var(--ok)}
  datalist{color:#000}
</style>
</head>
<body>
<header>
  <h1>🎫 Playable Tickets</h1>
  <input id="search" class="search" placeholder="Поиск по тикетам…">
  <span class="grow"></span>
  <span id="saveState" class="save-state"></span>
  <button class="btn sm" id="linkBtn" title="Привязать tickets.json для автосохранения на диск">🔗 Привязать файл</button>
  <button class="btn sm" id="exportBtn">⬇ Экспорт</button>
  <button class="btn sm" id="importBtn">⬆ Импорт</button>
  <button class="btn primary" id="newBtn">+ Новый тикет</button>
</header>

<main>
  <aside id="sidebar"></aside>
  <section class="list">
    <div class="toolbar">
      <div class="seg" id="statusSeg">
        <button data-s="all" class="active">Все</button>
        <button data-s="open">Открытые</button>
        <button data-s="in_progress">В работе</button>
        <button data-s="closed">Закрытые</button>
      </div>
      <div class="seg" id="sortSeg">
        <button data-o="updated" class="active">По обновлению</button>
        <button data-o="created">По дате</button>
        <button data-o="priority">По приоритету</button>
      </div>
      <span class="grow"></span>
      <span id="countLbl" class="hint"></span>
    </div>
    <div id="tickets"></div>
  </section>
</main>

<!-- New/Edit modal -->
<div class="ov" id="editOv">
  <div class="modal">
    <h2 id="editTitle">Новый тикет</h2>
    <div class="field">
      <label>Заголовок</label>
      <input id="f-title" placeholder="Коротко о задаче">
    </div>
    <div class="row">
      <div class="field">
        <label>Плеейбл</label>
        <input id="f-playable" list="playableList" placeholder="merge-…">
        <datalist id="playableList"></datalist>
      </div>
      <div class="field">
        <label>Приоритет</label>
        <select id="f-priority"><option value="high">Высокий</option><option value="med" selected>Средний</option><option value="low">Низкий</option></select>
      </div>
      <div class="field">
        <label>Статус</label>
        <select id="f-status"><option value="open" selected>Открыт</option><option value="in_progress">В работе</option><option value="closed">Закрыт</option></select>
      </div>
    </div>
    <div class="field">
      <label>Описание / доработки</label>
      <textarea id="f-desc" placeholder="Что нужно сделать, контекст, чек-лист…"></textarea>
    </div>
    <div class="actions">
      <button class="btn ghost" id="editCancel">Отмена</button>
      <button class="btn primary" id="editSave">Сохранить</button>
    </div>
  </div>
</div>

<!-- Detail modal -->
<div class="ov" id="detailOv">
  <div class="modal">
    <div style="display:flex;align-items:center;gap:8px;margin-bottom:6px">
      <span id="d-id" class="tid hint"></span>
      <span id="d-prio"></span>
      <span id="d-statusPill"></span>
      <span class="grow" style="flex:1"></span>
      <button class="btn sm" id="d-edit">✎ Изменить</button>
    </div>
    <h2 id="d-title" style="margin:4px 0 6px"></h2>
    <div class="hint" id="d-sub" style="margin-bottom:12px"></div>
    <div class="desc-block" id="d-desc"></div>
    <div class="comments">
      <div class="hint" style="margin-bottom:8px">Комментарии</div>
      <div id="d-comments"></div>
      <div class="addc">
        <textarea id="d-newcomment" placeholder="Добавить комментарий…"></textarea>
        <button class="btn primary" id="d-addcomment">Отправить</button>
      </div>
    </div>
    <div class="actions" style="margin-top:16px">
      <button class="btn" id="d-delete" style="color:var(--bad)">Удалить</button>
      <span class="grow"></span>
      <button class="btn" id="d-toggle"></button>
      <button class="btn ghost" id="d-close">Закрыть окно</button>
    </div>
  </div>
</div>

<input type="file" id="fileInput" accept="application/json" style="display:none">

<script>
const SEED_PLAYABLES = [
  "merge-timepress-v1","merge-timepress-v1-ru","merge-timepress-v2","merge-timepress-v2-ru",
  "merge-timepress-no-orders-v1","merge-timepress-no-orders-v2","merge-timepress-no-orders-v3",
  "merge-locked-v1","merge-locked-v2",
  "merge-second-board-v1","merge-second-board-v1_1","merge-second-board-v2","merge-second-board-v3",
  "merge-mini-v1","marble-sort","template"
];
const LS_KEY = "p4g_playable_tickets_v1";
const STATUS_LABEL = {open:"Открыт", in_progress:"В работе", closed:"Закрыт"};
const PRIO_LABEL = {high:"Высокий", med:"Средний", low:"Низкий"};
const PRIO_RANK = {high:3, med:2, low:1};

let state = load() || { seq:0, tickets:[] };
let view = { playable:"all", status:"all", sort:"updated", q:"" };
let fileHandle = null; // FS Access API handle (session)

/* ---------- persistence ---------- */
function load(){ try{ return JSON.parse(localStorage.getItem(LS_KEY)); }catch{ return null; } }
async function persist(){
  localStorage.setItem(LS_KEY, JSON.stringify(state));
  setSaveState("localStorage");
  if(fileHandle){
    try{
      const w = await fileHandle.createWritable();
      await w.write(JSON.stringify(state, null, 2));
      await w.close();
      setSaveState("файл ✓");
    }catch(e){ setSaveState("файл: ошибка записи", true); }
  }
}
function setSaveState(where, err){
  const el = document.getElementById("saveState");
  el.innerHTML = err ? `<span style="color:var(--bad)">${where}</span>`
    : `Сохранено: <b>${where}</b>`;
}
const idbKey = "ticketsFileHandle";
function idb(){ return new Promise((res,rej)=>{ const r=indexedDB.open("p4g-tickets",1); r.onupgradeneeded=()=>r.result.createObjectStore("kv"); r.onsuccess=()=>res(r.result); r.onerror=()=>rej(r.error); }); }
async function idbSet(k,v){ const db=await idb(); return new Promise((res,rej)=>{ const t=db.transaction("kv","readwrite"); t.objectStore("kv").put(v,k); t.oncomplete=res; t.onerror=()=>rej(t.error); }); }
async function idbGet(k){ const db=await idb(); return new Promise((res,rej)=>{ const t=db.transaction("kv","readonly"); const rq=t.objectStore("kv").get(k); rq.onsuccess=()=>res(rq.result); rq.onerror=()=>rej(rq.error); }); }

async function linkFile(){
  if(!window.showSaveFilePicker){
    alert("Этот браузер не поддерживает прямую запись в файл.\nИспользуй «Экспорт» — сохрани tickets.json в папку playables, а при следующем открытии «Импорт».\n(Прямая привязка работает в Chrome/Edge.)");
    return;
  }
  try{
    fileHandle = await window.showSaveFilePicker({
      suggestedName:"tickets.json",
      types:[{description:"JSON", accept:{"application/json":[".json"]}}]
    });
    await idbSet(idbKey, fileHandle);
    await persist();
  }catch(e){ /* cancelled */ }
}
async function restoreLink(){
  try{
    const h = await idbGet(idbKey);
    if(!h) return;
    const perm = await h.queryPermission({mode:"readwrite"});
    if(perm==="granted"){ fileHandle=h; setSaveState("файл привязан"); }
    else { setSaveState("файл привязан (нужно подтвердить)"); document.getElementById("linkBtn").textContent="🔗 Подтвердить файл"; }
  }catch{}
}

/* ---------- helpers ---------- */
function now(){ return new Date().toISOString(); }
function fmt(iso){ if(!iso) return "—"; const d=new Date(iso); return d.toLocaleString("ru-RU",{day:"2-digit",month:"2-digit",year:"2-digit",hour:"2-digit",minute:"2-digit"}); }
function allPlayables(){ const set=new Set(SEED_PLAYABLES); state.tickets.forEach(t=>t.playable&&set.add(t.playable)); return [...set].sort(); }
function openCount(pl){ return state.tickets.filter(t=>t.status!=="closed"&&(pl==="all"||t.playable===pl)).length; }

/* ---------- rendering ---------- */
function renderSidebar(){
  const sb=document.getElementById("sidebar");
  const totalOpen=openCount("all");
  let html=`<div class="navitem-wrap">`;
  html+=navHtml("all","Все плеейблы",totalOpen);
  html+=`<div class="sec">Плеейблы</div>`;
  allPlayables().forEach(pl=> html+=navHtml(pl, pl, openCount(pl)));
  html+=`</div>`;
  sb.innerHTML=html;
  sb.querySelectorAll(".navitem").forEach(n=>n.onclick=()=>{ view.playable=n.dataset.pl; render(); });
}
function navHtml(pl,name,cnt){
  const active = view.playable===pl ? " active":"";
  return `<div class="navitem${active}" data-pl="${pl}"><span class="navitem-name">${name}</span><span class="cnt">${cnt}</span></div>`;
}
function filteredTickets(){
  let ts=state.tickets.slice();
  if(view.playable!=="all") ts=ts.filter(t=>t.playable===view.playable);
  if(view.status!=="all") ts=ts.filter(t=>t.status===view.status);
  if(view.q){ const q=view.q.toLowerCase(); ts=ts.filter(t=>(t.title+" "+t.desc+" "+(t.playable||"")).toLowerCase().includes(q)); }
  ts.sort((a,b)=>{
    if(view.sort==="priority") return PRIO_RANK[b.priority]-PRIO_RANK[a.priority] || (b.updatedAt>a.updatedAt?1:-1);
    if(view.sort==="created") return b.createdAt>a.createdAt?1:-1;
    return b.updatedAt>a.updatedAt?1:-1;
  });
  return ts;
}
function render(){
  renderSidebar();
  const wrap=document.getElementById("tickets");
  const ts=filteredTickets();
  document.getElementById("countLbl").textContent = `${ts.length} тикет(ов)`;
  if(!ts.length){ wrap.innerHTML=`<div class="empty">Нет тикетов. Нажми «+ Новый тикет».</div>`; return; }
  wrap.innerHTML = ts.map(t=>`
    <div class="ticket ${t.status==='closed'?'closed':''}" data-id="${t.id}">
      <div class="top">
        <span class="status-dot ${t.status==='closed'?'d-closed':t.status==='in_progress'?'d-progress':'d-open'}"></span>
        <span class="tid">#${t.id}</span>
        <span class="title">${esc(t.title)}</span>
        <span class="pill pr-${t.priority}">${PRIO_LABEL[t.priority]}</span>
      </div>
      <div class="meta">
        ${t.playable?`<span class="tag">${esc(t.playable)}</span>`:""}
        <span>${STATUS_LABEL[t.status]}</span>
        ${t.comments.length?`<span>💬 ${t.comments.length}</span>`:""}
        <span>обновлён ${fmt(t.updatedAt)}</span>
      </div>
    </div>`).join("");
  wrap.querySelectorAll(".ticket").forEach(el=>el.onclick=()=>openDetail(+el.dataset.id));
}
function esc(s){ return (s||"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c])); }

/* ---------- create / edit ---------- */
let editingId=null;
function openEdit(id){
  editingId=id;
  const t = id!=null ? state.tickets.find(x=>x.id===id) : null;
  document.getElementById("editTitle").textContent = t?`Тикет #${id}`:"Новый тикет";
  document.getElementById("f-title").value = t?t.title:"";
  document.getElementById("f-playable").value = t?t.playable:(view.playable!=="all"?view.playable:"");
  document.getElementById("f-priority").value = t?t.priority:"med";
  document.getElementById("f-status").value = t?t.status:"open";
  document.getElementById("f-desc").value = t?t.desc:"";
  document.getElementById("playableList").innerHTML = allPlayables().map(p=>`<option value="${p}">`).join("");
  show("editOv");
  document.getElementById("f-title").focus();
}
async function saveEdit(){
  const title=document.getElementById("f-title").value.trim();
  if(!title){ alert("Нужен заголовок"); return; }
  const data={
    title,
    playable:document.getElementById("f-playable").value.trim(),
    priority:document.getElementById("f-priority").value,
    status:document.getElementById("f-status").value,
    desc:document.getElementById("f-desc").value.trim(),
  };
  if(editingId!=null){
    const t=state.tickets.find(x=>x.id===editingId);
    Object.assign(t,data); t.updatedAt=now();
  }else{
    state.seq++;
    state.tickets.push({ id:state.seq, ...data, comments:[], createdAt:now(), updatedAt:now() });
  }
  await persist(); hide("editOv"); render();
  if(editingId!=null) openDetail(editingId);
}

/* ---------- detail ---------- */
let detailId=null;
function openDetail(id){
  detailId=id;
  const t=state.tickets.find(x=>x.id===id); if(!t) return;
  document.getElementById("d-id").textContent="#"+t.id;
  document.getElementById("d-prio").innerHTML=`<span class="pill pr-${t.priority}">${PRIO_LABEL[t.priority]}</span>`;
  document.getElementById("d-statusPill").innerHTML=`<span class="status-dot ${t.status==='closed'?'d-closed':t.status==='in_progress'?'d-progress':'d-open'}"></span>${STATUS_LABEL[t.status]}`;
  document.getElementById("d-title").textContent=t.title;
  document.getElementById("d-sub").innerHTML=`${t.playable?'<span class="tag">'+esc(t.playable)+'</span> · ':''}создан ${fmt(t.createdAt)} · обновлён ${fmt(t.updatedAt)}`;
  document.getElementById("d-desc").textContent=t.desc||"(без описания)";
  document.getElementById("d-comments").innerHTML = t.comments.length
    ? t.comments.map(c=>`<div class="comment"><div class="c-meta">${fmt(c.ts)}</div><div class="c-text">${esc(c.text)}</div></div>`).join("")
    : `<div class="hint">Пока нет комментариев.</div>`;
  const tog=document.getElementById("d-toggle");
  tog.textContent = t.status==="closed" ? "↺ Переоткрыть" : "✓ Закрыть тикет";
  show("detailOv");
}
async function addComment(){
  const ta=document.getElementById("d-newcomment");
  const text=ta.value.trim(); if(!text) return;
  const t=state.tickets.find(x=>x.id===detailId);
  t.comments.push({ts:now(), text}); t.updatedAt=now();
  ta.value=""; await persist(); openDetail(detailId); render();
}
async function toggleStatus(){
  const t=state.tickets.find(x=>x.id===detailId);
  t.status = t.status==="closed" ? "open" : "closed";
  t.comments.push({ts:now(), text: t.status==="closed"?"— тикет закрыт —":"— тикет переоткрыт —"});
  t.updatedAt=now(); await persist(); openDetail(detailId); render();
}
async function deleteTicket(){
  if(!confirm("Удалить тикет безвозвратно?")) return;
  state.tickets=state.tickets.filter(x=>x.id!==detailId);
  await persist(); hide("detailOv"); render();
}

/* ---------- export / import ---------- */
function exportJson(){
  const blob=new Blob([JSON.stringify(state,null,2)],{type:"application/json"});
  const a=document.createElement("a"); a.href=URL.createObjectURL(blob);
  a.download="tickets.json"; a.click(); URL.revokeObjectURL(a.href);
}
function importJson(file){
  const r=new FileReader();
  r.onload=()=>{ try{
    const d=JSON.parse(r.result);
    if(!d||!Array.isArray(d.tickets)) throw 0;
    state=d; persist(); render(); alert("Импортировано тикетов: "+d.tickets.length);
  }catch{ alert("Не похоже на корректный tickets.json"); } };
  r.readAsText(file);
}

/* ---------- modal utils ---------- */
function show(id){ document.getElementById(id).classList.add("show"); }
function hide(id){ document.getElementById(id).classList.remove("show"); }

/* ---------- wire up ---------- */
document.getElementById("newBtn").onclick=()=>openEdit(null);
document.getElementById("editCancel").onclick=()=>hide("editOv");
document.getElementById("editSave").onclick=saveEdit;
document.getElementById("d-close").onclick=()=>hide("detailOv");
document.getElementById("d-edit").onclick=()=>{ hide("detailOv"); openEdit(detailId); };
document.getElementById("d-addcomment").onclick=addComment;
document.getElementById("d-toggle").onclick=toggleStatus;
document.getElementById("d-delete").onclick=deleteTicket;
document.getElementById("exportBtn").onclick=exportJson;
document.getElementById("importBtn").onclick=()=>document.getElementById("fileInput").click();
document.getElementById("fileInput").onchange=e=>{ if(e.target.files[0]) importJson(e.target.files[0]); };
document.getElementById("linkBtn").onclick=linkFile;
document.getElementById("search").oninput=e=>{ view.q=e.target.value; render(); };
document.querySelectorAll("#statusSeg button").forEach(b=>b.onclick=()=>{ view.status=b.dataset.s; document.querySelectorAll("#statusSeg button").forEach(x=>x.classList.toggle("active",x===b)); render(); });
document.querySelectorAll("#sortSeg button").forEach(b=>b.onclick=()=>{ view.sort=b.dataset.o; document.querySelectorAll("#sortSeg button").forEach(x=>x.classList.toggle("active",x===b)); render(); });
document.querySelectorAll(".ov").forEach(ov=>ov.onclick=e=>{ if(e.target===ov) ov.classList.remove("show"); });
document.addEventListener("keydown",e=>{ if(e.key==="Escape") document.querySelectorAll(".ov.show").forEach(o=>o.classList.remove("show")); });

/* ---------- seed demo if empty ---------- */
if(!state.tickets.length){
  const ts=now();
