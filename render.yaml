# Render.com deploy — single static site that publishes the repo root.
# Connect on render.com (New → Static Site → pick this repo); Render reads this
# file and provisions the service. Subsequent pushes auto-deploy.
#
# Contents:
#   index.html      — the swipe feed (built from the feed-prototype project)
#   <id>.html       — each mini-game's SWIPE build (from playables/<id>/dist-swipe)
# The feed loads ./<id>.html as same-origin siblings, so off-screen pause and the
# postMessage completion bridge work.
services:
  - type: web
    name: swipe-platform
    runtime: static
    buildCommand: ""
    staticPublishPath: ./
    # NB: the TMA calls the backend by its ABSOLUTE URL (CORS is enabled there).
    # Render Static can't proxy /api/* to an external service, so there's no
    # same-origin rewrite here (the D6 "static proxy" idea doesn't apply on Render).
    headers:
      - path: /*
        name: Cache-Control
        # Short cache during active iteration so deploys show up immediately (avoids
        # "I still see the old version" from a 1h cache). Raise for production.
        value: public, max-age=60
